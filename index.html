<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>旋转飞刀割草·商业版</title>
<style>
  body { margin: 0; padding: 0; background: #111; overflow: hidden; font-family: sans-serif; touch-action: none; user-select: none; }
  #gameContainer { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: #2c3e50; }
  canvas { display: block; }
  .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; color: #fff; text-shadow: 1px 1px 2px #000; }
  .panel { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.85); padding: 30px; border-radius: 15px; text-align: center; pointer-events: auto; border: 2px solid #f1c40f; box-shadow: 0 0 20px #f1c40f; }
  .panel h1 { margin-top: 0; color: #f1c40f; }
  .btn { display: inline-block; margin-top: 20px; padding: 12px 30px; background: #e67e22; color: #fff; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
  .btn:active { transform: scale(0.95); }
  #hud { display: flex; justify-content: space-between; padding: 10px; font-size: 16px; font-weight: bold; }
  .hud-box { background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 20px; }
  #upgradePanel { display: none; }
  .upgrade-cards { display: flex; gap: 15px; margin-top: 20px; justify-content: center; }
  .card { background: #34495e; padding: 15px; border-radius: 10px; cursor: pointer; width: 100px; border: 2px solid #3498db; }
  .card:hover { transform: scale(1.05); }
  .card h3 { margin: 0 0 10px 0; font-size: 14px; color: #3498db; }
  .card p { margin: 0; font-size: 12px; font-weight: normal; }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>
  
  <!-- 登录界面 -->
  <div id="loginPanel" class="ui-layer panel">
    <h1>旋转飞刀割草</h1>
    <p>商业重制版 · 60FPS 极速体验</p>
    <button class="btn" onclick="startGame()">开始游戏</button>
  </div>

  <!-- 游戏HUD -->
  <div id="hud" class="ui-layer" style="display:none;">
    <div>
      <div class="hud-box" id="hpText">HP 5/5</div>
      <div class="hud-box" style="margin-top:5px;">分数 <span id="scoreText">0</span></div>
    </div>
    <div style="text-align:right;">
      <div class="hud-box">金币 <span id="coinText">0</span></div>
      <div class="hud-box" style="margin-top:5px;">时间 <span id="timeText">0:00</span></div>
    </div>
  </div>

  <!-- 升级/武器库界面 -->
  <div id="upgradePanel" class="ui-layer panel">
    <h2>选择升级</h2>
    <div class="upgrade-cards" id="cardsContainer"></div>
  </div>

  <!-- 商店界面 -->
  <div id="shopPanel" class="ui-layer panel" style="display:none;">
    <h2>金币商店</h2>
    <p>当前金币: <span id="shopCoin">0</span></p>
    <button class="btn" onclick="buyItem()">购买 飞刀+1 (50金)</button><br><br>
    <button class="btn" style="background:#95a5a6;" onclick="closeShop()">继续游戏</button>
  </div>
</div>

<script>
/* ============ 配置与状态 ============ */
const CFG = {
  mapW: 5000, mapH: 5000,
  heroHp: 5, knifeSpeed: 0.05, knifeRadius: 50,
  spawnBase: 400, maxParticles: 150, // 严格限制粒子数防卡顿
  dropRate: 0.4 // 掉落率翻倍
};

const state = {
  running: false, paused: false, time: 0,
  score: 0, coins: 0, hp: CFG.heroHp,
  camX: 0, camY: 0,
  knives: [], enemies: [], particles: [], drops: [],
  hero: { x: 0, y: 0, w: 60, h: 60, tx: 0, ty: 0 }
};

/* ============ 对象池 (防GC卡顿核心) ============ */
const pools = { particle: [], enemy: [] };
function getPoolObj(type) { return pools[type].pop() || {}; }
function releasePoolObj(type, obj) { pools[type].push(obj); }

/* ============ 初始化与素材预加载 ============ */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const imgs = {};
const needImgs = ['bg','hero','knife','monster','monster2','boss','boss2','effect'];

function initCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', initCanvas);
initCanvas();

// 自动抠白底函数 (离屏Canvas预处理)
function removeWhiteBg(src, cb) {
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.onload = () => {
    const off = document.createElement('canvas');
    off.width = img.width; off.height = img.height;
    const octx = off.getContext('2d');
    octx.drawImage(img, 0, 0);
    try {
      const data = octx.getImageData(0,0,off.width,off.height);
      for(let i=0;i<data.data.length;i+=4) {
        if(data.data[i]>240 && data.data[i+1]>240 && data.data[i+2]>240) data.data[i+3]=0;
      }
      octx.putImageData(data,0,0);
      cb(off);
    } catch(e) { cb(img); } // 跨域兜底
  };
  img.onerror = () => cb(null);
  img.src = src;
}

needImgs.forEach(k => removeWhiteBg(k+'.jpg', res => imgs[k] = res));

/* ============ 输入控制 ============ */
let touchTarget = { x: canvas.width/2, y: canvas.height/2 };
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  touchTarget.x = t.clientX; touchTarget.y = t.clientY;
});
canvas.addEventListener('mousemove', e => {
  touchTarget.x = e.clientX; touchTarget.y = e.clientY;
});

/* ============ 游戏逻辑 ============ */
function startGame() {
  document.getElementById('loginPanel').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  state.running = true; state.time = 0;
  state.score = 0; state.coins = 0; state.hp = CFG.heroHp;
  state.knives = []; state.enemies = []; state.particles = []; state.drops = [];
  state.hero.x = CFG.mapW/2; state.hero.y = CFG.mapH/2;
  state.hero.tx = state.hero.x; state.hero.ty = state.hero.y;
  
  // 初始飞刀
  state.knives.push({ angle: 0, r: CFG.knifeRadius });
  
  lastT = performance.now();
  requestAnimationFrame(loop);
}

function spawnEnemy() {
  if(state.enemies.length > 80) return; // 限制同屏怪物数量保帧率
  const e = getPoolObj('enemy');
  e.x = state.hero.x + (Math.random()-0.5)*800;
  e.y = state.hero.y + (Math.random()-0.5)*800;
  e.hp = 1; e.type = Math.random()>0.8 ? 2 : 1;
  state.enemies.push(e);
}

function spawnDrop(x, y) {
  if(Math.random() < CFG.dropRate) {
    state.drops.push({ x: x, y: y, type: Math.random()>0.7?'coin':'exp', life: 5000 });
  }
}

function explode(x, y) {
  // 限制最大粒子数，防止爆炸卡顿
  if(state.particles.length > CFG.maxParticles) return;
  const count = Math.min(5, CFG.maxParticles - state.particles.length);
  for(let i=0; i<count; i++) {
    const p = getPoolObj('particle');
    p.x = x; p.y = y; p.vx = (Math.random()-0.5)*10; p.vy = (Math.random()-0.5)*10;
    p.life = 30; p.maxLife = 30;
    state.particles.push(p);
  }
}

function update(dt) {
  state.time += dt;
  
  // 英雄平滑移动 (Lerp)
  state.hero.tx += (touchTarget.x - canvas.width/2) * 0.1;
  state.hero.ty += (touchTarget.y - canvas.height/2) * 0.1;
  state.hero.x += (state.hero.tx - state.hero.y) * 0.1; // 简化跟随
  state.hero.y += (state.hero.ty - state.hero.y) * 0.1;
  
  // 摄像机平滑跟随
  state.camX = state.hero.x - canvas.width/2;
  state.camY = state.hero.y - canvas.height/2;

  // 飞刀旋转
  state.knives.forEach(k => k.angle += CFG.knifeSpeed * (dt/16));

  // 刷怪逻辑
  if(Math.random() < dt/500) spawnEnemy();

  // 怪物追踪
  state.enemies.forEach(e => {
    const dx = state.hero.x - e.x, dy = state.hero.y - e.y;
    const distSq = dx*dx + dy*dy;
    if(distSq < 40000) { // 距离粗筛
      const dist = Math.sqrt(distSq);
      e.x += (dx/dist) * 2;
      e.y += (dy/dist) * 2;
    }
  });

  // 碰撞检测 (平方距离优化)
  state.knives.forEach(k => {
    const kx = state.hero.x + Math.cos(k.angle) * k.r;
    const ky = state.hero.y + Math.sin(k.angle) * k.r;
    
    for(let i=state.enemies.length-1; i>=0; i--) {
      const e = state.enemies[i];
      const dx = kx - e.x, dy = ky - e.y;
      if(dx*dx + dy*dy < 1600) { // 碰撞半径平方
        explode(e.x, e.y);
        spawnDrop(e.x, e.y);
        state.score += 10;
        releasePoolObj('enemy', state.enemies.splice(i, 1)[0]);
      }
    }
  });

  // 拾取道具
  for(let i=state.drops.length-1; i>=0; i--) {
    const d = state.drops[i];
    const dx = state.hero.x - d.x, dy = state.hero.y - d.y;
    if(dx*dx + dy*dy < 2500) {
      if(d.type==='coin') state.coins++;
      state.drops.splice(i, 1);
    }
  }

  // 粒子更新
  for(let i=state.particles.length-1; i>=0; i--) {
    const p = state.particles[i];
    p.x += p.vx; p.y += p.vy; p.life--;
    if(p.life<=0) releasePoolObj('particle', state.particles.splice(i, 1)[0]);
  }
}

/* ============ 渲染 (离屏预渲染与批量绘制) ============ */
function draw() {
  // 1. 绘制程序化地图背景 (代替图片循环)
  ctx.fillStyle = '#2c3e50';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  ctx.save();
  ctx.translate(-state.camX, -state.camY);
  
  // 绘制地图网格与装饰
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 2;
  const gridSize = 100;
  const startX = Math.floor(state.camX/gridSize)*gridSize;
  const startY = Math.floor(state.camY/gridSize)*gridSize;
  for(let x=startX; x<startX+canvas.width+gridSize; x+=gridSize) { ctx.beginPath(); ctx.moveTo(x, state.camY); ctx.lineTo(x, state.camY+canvas.height); ctx.stroke(); }
  for(let y=startY; y<startY+canvas.height+gridSize; y+=gridSize) { ctx.beginPath(); ctx.moveTo(state.camX, y); ctx.lineTo(state.camX+canvas.width, y); ctx.stroke(); }

  // 2. 绘制道具
  state.drops.forEach(d => {
    ctx.fillStyle = d.type==='coin' ? '#f1c40f' : '#3498db';
    ctx.beginPath(); ctx.arc(d.x, d.y, 8, 0, Math.PI*2); ctx.fill();
  });

  // 3. 绘制怪物 (批量)
  const mImg1 = imgs.monster, mImg2 = imgs.monster2;
  state.enemies.forEach(e => {
    const img = e.type===1 ? mImg1 : mImg2;
    if(img && img.complete) ctx.drawImage(img, e.x-25, e.y-25, 50, 50);
    else { ctx.fillStyle='red'; ctx.fillRect(e.x-25, e.y-25, 50, 50); }
  });

  // 4. 绘制英雄
  if(imgs.hero && imgs.hero.complete) ctx.drawImage(imgs.hero, state.hero.x-30, state.hero.y-30, 60, 60);

  // 5. 绘制飞刀环绕
  const kImg = imgs.knife;
  state.knives.forEach(k => {
    const kx = state.hero.x + Math.cos(k.angle) * k.r;
    const ky = state.hero.y + Math.sin(k.angle) * k.r;
    ctx.save();
    ctx.translate(kx, ky);
    ctx.rotate(k.angle);
    if(kImg && kImg.complete) ctx.drawImage(kImg, -15, -15, 30, 30);
    ctx.restore();
  });

  // 6. 绘制粒子特效
  const eImg = imgs.effect;
  state.particles.forEach(p => {
    if(eImg && eImg.complete) ctx.drawImage(eImg, p.x-20, p.y-20, 40, 40);
  });

  ctx.restore();
  
  // 更新HUD
  document.getElementById('hpText').textContent = 'HP ' + state.hp + '/' + CFG.heroHp;
  document.getElementById('scoreText').textContent = state.score;
  document.getElementById('coinText').textContent = state.coins;
  document.getElementById('timeText').textContent = Math.floor(state.time/1000) + 's';
}

let lastT = 0;
function loop(t) {
  if(!state.running) return;
  const dt = Math.min(t - lastT, 50);
  lastT = t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

/* ============ UI系统逻辑 ============ */
function buyItem() {
  if(state.coins >= 50) {
    state.coins -= 50;
    state.knives.push({ angle: Math.random()*Math.PI*2, r: CFG.knifeRadius });
    closeShop();
  } else { alert('金币不足！'); }
}
function closeShop() { document.getElementById('shopPanel').style.display = 'none'; state.running = true; lastT = performance.now(); requestAnimationFrame(loop); }
</script>
</body>
</html>
